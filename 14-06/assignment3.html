<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Radius Shapes</title>

<style>
body{
    font-family: Arial, sans-serif;
}

.container{
    display:flex;
    flex-wrap:wrap;
    gap:30px;
    padding:20px;
}

.shape{
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding-top:30px;
}

/* Leaf */
.leaf{
    width:150px;
    height:150px;
    background:deepskyblue;
    border-radius:0 100% 0 100%;
}

/* Half Oval */
.half-oval{
    width:300px;
    height:150px;
    background:blue;
    border-radius:0 0 150px 150px;
}

/* Oval */
.oval{
    width:300px;
    height:180px;
    background:orange;
    border-radius:50%;
}

/* Twist */
.twist{
    width:350px;
    height:150px;
    background:green;
    border-radius:0 100% 0 100%;
    transform:rotate(10deg);
}

/* Twist Two */
.twist-two{
    width:350px;
    height:180px;
    background:purple;
    border-radius:0 100px 0 100px;
}

/* Circle */
.circle{
    width:180px;
    height:180px;
    background:magenta;
    border-radius:50%;
}

/* Tab */
.tab{
    width:180px;
    height:180px;
    background:deepskyblue;
    border-radius:0 0 50% 50%;
}

/* Three Sided */
.three-sided{
    width:180px;
    height:180px;
    background:blue;
    border-radius:0 50% 50% 50%;
}
</style>
</head>
<body>

<div class="container">

    <div class="shape leaf">Leaf</div>

    <div class="shape half-oval">Half Oval</div>

    <div class="shape oval">Oval</div>

    <div class="shape twist">Twist</div>

    <div class="shape twist-two">Twist Two</div>

    <div class="shape circle">Circle</div>

    <div class="shape tab">Tab</div>

    <div class="shape three-sided">Three Sided</div>

</div>

</body>
</html>
