<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Cards</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
}

.container{

    width:850px;
    height:500px;

    background:#ef6d64;

    border-radius:20px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);

    gap:20px;
    padding:35px;
}

/* All cards */

.card{

    background:rgba(255,255,255,.18);

    border-radius:12px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.45s;

    position:relative;
}

/* Circle */

.circle{

    width:55px;
    height:55px;

    border-radius:50%;

    background:#d7d7d7;

    margin-bottom:18px;

    transition:.4s;
}

.card h3{

    color:#666;
    font-size:17px;
}

.card p{

    color:#888;
    font-size:13px;
}

/* When mouse enters container */

.container:hover .card{

    opacity:.45;
    transform:scale(.92);
    filter:blur(.5px);
}

/* Active card */

.container .card:hover{

    opacity:1;
    filter:none;

    background:#fff;

    transform:scale(1.18);

    z-index:10;

    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

/* Circle effect */

.container .card:hover .circle{

    background:linear-gradient(135deg,#8b5cf6,#ef4444);
    transform:scale(1.15);
}
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <div class="circle"></div>
        <h3>Section 1</h3>
        <p>Lorem Ipsum</p>
    </div>

    <div class="card">
        <div class="circle"></div>
        <h3>Section 2</h3>
        <p>Lorem Ipsum</p>
    </div>

    <div class="card">
        <div class="circle"></div>
        <h3>Section 3</h3>
        <p>Lorem Ipsum</p>
    </div>

    <div class="card">
        <div class="circle"></div>
        <h3>Section 4</h3>
        <p>Lorem Ipsum</p>
    </div>

    <div class="card">
        <div class="circle"></div>
        <h3>Section 5</h3>
        <p>Lorem Ipsum</p>
    </div>

    <div class="card">
        <div class="circle"></div>
        <h3>Section 6</h3>
        <p>Lorem Ipsum</p>
    </div>

</div>

</body>
</html>
