<!DOCTYPE html>
<html>
<head>
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
}

.main{
    width:100%;
    height:100vh;
    background-image:url("/ChatGPT\ Image\ Jun\ 23\,\ 2026\,\ 01_12_07\ PM.png"); /* Put your image name here */
    background-size:cover;
    background-position:center;
}

.main::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background-color:rgba(0,0,0,0.7);
}

.navbar{
    position:relative;
    z-index:1;
    padding:20px 100px;
}

.navbar h1{
    color:red;
    display:inline;
    font-size:50px;
}

.lang{
    margin-left:900px;
    padding:10px 20px;
    background-color:black;
    color:white;
    border:1px solid white;
    border-radius:5px;
}

.signin{
    padding:10px 20px;
    background-color:red;
    color:white;
    border:none;
    border-radius:5px;
}

.content{
    position:relative;
    z-index:1;
    text-align:center;
    color:white;
    margin-top:150px;
}

.content h1{
    font-size:70px;
    font-weight:bold;
}

.content h2{
    margin-top:20px;
    font-size:30px;
}

.content p{
    margin-top:30px;
    font-size:20px;
}

input{
    margin-top:30px;
    width:350px;
    height:60px;
    background-color:rgba(0,0,0,0.5);
    color:white;
    border:1px solid gray;
    font-size:20px;
    padding-left:15px;
}

.start{
    width:250px;
    height:60px;
    background-color:red;
    color:white;
    border:none;
    font-size:30px;
    border-radius:5px;
}
    </style>
</head>
<body>

    <div class="main">

        <div class="navbar">
            <h1>NETFLIX</h1>

            <button class="lang">English</button>
            <button class="signin">Sign In</button>
        </div>

        <div class="content">

            <h1>Unlimited movies,<br>shows, and more</h1>

            <h2>Starts at ₹149. Cancel at any time.</h2>

            <p>Ready to watch? Enter your email to create or restart your membership.</p>

            <input type="email" placeholder="Email address">

            <button class="start">Get Started ></button>

        </div>

    </div>

</body>
</html>
