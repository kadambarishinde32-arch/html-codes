<!DOCTYPE html>
<html>
<head>
    <title>Instagram Logo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
}

.instagram{
    width:400px;
    height:400px;
    border-radius:90px;
    background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
    display:flex;
    justify-content:center;
    align-items:center;
}

.inner-box{
    width:250px;
    height:250px;
    border:20px solid white;
    border-radius:70px;
    position:relative;
}

.circle{
    width:110px;
    height:110px;
    border:20px solid white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.dot{
    width:30px;
    height:30px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:35px;
    right:35px;
}
    </style>
</head>
<body>

    <div class="instagram">
        <div class="inner-box">
            <div class="circle"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
